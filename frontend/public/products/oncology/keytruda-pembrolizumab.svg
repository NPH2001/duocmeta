<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Keytruda pembrolizumab oncology prescription illustration</title>
  <desc id="desc">Green and white illustrative medicine vial for prescription oncology product listing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="0.55" stop-color="#d1fae5"/>
      <stop offset="1" stop-color="#f7fee7"/>
    </linearGradient>
    <linearGradient id="vial" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#064e3b" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="46" fill="url(#bg)"/>
  <circle cx="826" cy="96" r="118" fill="#34d399" opacity="0.16"/>
  <circle cx="135" cy="448" r="150" fill="#84cc16" opacity="0.12"/>
  <g filter="url(#shadow)">
    <rect x="354" y="70" width="252" height="52" rx="16" fill="#064e3b"/>
    <rect x="374" y="118" width="212" height="308" rx="40" fill="url(#vial)" stroke="#047857" stroke-width="8"/>
    <rect x="394" y="196" width="172" height="140" rx="28" fill="#ffffff" stroke="#a7f3d0" stroke-width="4"/>
    <path d="M430 372c26-43 74-43 100 0" fill="none" stroke="#059669" stroke-width="16" stroke-linecap="round"/>
    <circle cx="480" cy="372" r="18" fill="#10b981"/>
  </g>
  <text x="480" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#064e3b">KEYTRUDA</text>
  <text x="480" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#047857">pembrolizumab</text>
  <text x="480" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#065f46">Rx oncology</text>
  <text x="84" y="102" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#047857">Prescription medicine</text>
  <text x="84" y="132" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#065f46">Consult oncology specialist</text>
  <path d="M704 366h52m-26-26v52" stroke="#059669" stroke-width="12" stroke-linecap="round"/>
